[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caca*"]

[project]
name = "caca"
version = "0.1.0"
description = "Care Casino - Monte Carlo healthcare cost simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Dmitrii Calzago" }]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
caca = "caca.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
