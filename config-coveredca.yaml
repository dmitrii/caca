# PURPOSE: Covered California example usage scenario

simulation:
  iterations: auto
  convergence_threshold_dollars: 100
  max_iterations: 100000
  min_iterations: 1000

defaults:
  costs:
    preventative_visit: 0
    primary_care_visit: 150-300
    specialist_visit: 200-500
    labs: 100-500
    imaging: 500-2500
    outpatient_services: 2000-15000
    outpatient_rehabilitation_services: 100-300
    inpatient_services: 15000-75000
    emergency_room: 1500-5000
    urgent_care: 150-400
    tier_1_generic_drugs: 10-50
    tier_2_preferred_brand_drugs: 50-200
    tier_3_non_preferred_brand_drugs: 150-500
    tier_4_specialty_drugs: 500-2000

profiles:
  # All household usage on subscriber (matches CoveredCA total counts exactly)
  # 3 Primary care, 2 Specialist, 5 Labs, 1 Outpatient, 36 Generic Rx, 17 Brand Rx
  coveredca_subscriber:
    primary_care_visit: 3
    specialist_visit: 2
    labs: 5
    outpatient_services: 1
    tier_1_generic_drugs: 36
    tier_2_preferred_brand_drugs: 17

  # Dependent usage added to match CoveredCA estimates.
  # CoveredCA's HDHP estimate ($36,015) implies ~$1,140 in dependent costs
  # beyond the subscriber hitting their individual OOP max ($7,200).
  # Without this, our HDHP estimate is ~$1,100 lower than CoveredCA's.
  coveredca_dependent:
    labs: 1
    primary_care_visit: 1

household:
  - name: subscriber
    profile: coveredca_subscriber
  - name: spouse
    profile: coveredca_dependent
  - name: child
    profile: coveredca_dependent
