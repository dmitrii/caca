  - plans/2026/bs-aca-gold-80-trio-hmo.yaml
  - plans/2026/bs-aca-silver-70-ppo.yaml
  - plans/2026/bs-aca-silver-70-trio-hmo.yaml
  - plans/2026/bs-pers-access-plus-hmo.yaml
  - plans/2026/bs-pers-gold-ppo.yaml
  - plans/2026/cf-bigcorp-blue-pref-gold-ppo.yaml
  - plans/2026/bs-offex-platinum-full-ppo.yaml

people:
  - profiles/calzone-dad-full.yaml
  - profiles/calzone-mom-full.yaml
  - profiles/calzone-kid-full.yaml
